plugins { id 'com.android.application' }

android {
    namespace 'ru.foldread'
    compileSdk 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'ru.foldread'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.6.1'
        testInstrumentationRunner 'ru.foldread.PlaybackChecks'
    }
    signingConfigs {
        if (System.getenv('FOLDREAD_KEYSTORE')) {
            publication {
                storeFile file(System.getenv('FOLDREAD_KEYSTORE'))
                storePassword System.getenv('FOLDREAD_KEY_PASSWORD')
                keyAlias 'foldread'
                keyPassword System.getenv('FOLDREAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.findByName('publication')) signingConfig signingConfigs.publication
        }
    }
}
dependencies {
    implementation 'androidx.window:window-java:1.3.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'
}
